# CI/CD for poi-lake.
#
# This file lives at oohx-poi/.github/ in the working repo and lands at the
# root of tuanna0703/oohx-poi through the subtree split (scripts/push-to-oohx-poi.*),
# so every path here is relative to the poi-lake root — no oohx-poi/ prefix.
#
#   build-test  every push / PR: build the production images, then lint and run
#               the whole suite *inside* the api image against the real
#               PostGIS + pgvector image — the same bits that ship.
#   deploy      pushes to main only, after build-test: SSH to the VPS with a
#               key whose forced command accepts nothing but a commit sha on
#               origin/main (scripts/deploy_entry.sh → scripts/ci_deploy.sh).
#
# The repo is public: workflow logs are public. Never echo a secret.

name: CI/CD

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
  workflow_dispatch:

# PR runs supersede each other; a main run is never cancelled mid-deploy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-test:
    name: build images, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: build api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api/Dockerfile
          load: true
          tags: poi-lake/api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: build postgres image
        uses: docker/build-push-action@v6
        with:
          context: docker/postgres
          load: true
          tags: poi-lake/postgres:ci
          cache-from: type=gha,scope=postgres
          cache-to: type=gha,scope=postgres,mode=max

      - name: build admin image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/admin/Dockerfile
          cache-from: type=gha,scope=admin
          cache-to: type=gha,scope=admin,mode=max

      # The image runs as uid 1000 and the checkout belongs to the runner
      # (uid 1001), so mount it read-only and keep tool caches out of it.
      - name: ruff
        run: docker run --rm -v "$PWD:/w:ro" -w /w poi-lake/api:ci ruff check --no-cache src tests scripts admin

      - name: mypy (informational until the codebase is fully typed)
        continue-on-error: true
        run: docker run --rm -v "$PWD:/w:ro" -w /w poi-lake/api:ci mypy --no-incremental --cache-dir=/tmp/mypy src

      - name: start postgres + redis
        run: |
          docker network create ci
          docker run -d --name pg --network ci \
            -e POSTGRES_DB=poi_lake -e POSTGRES_USER=poi -e POSTGRES_PASSWORD=poi \
            poi-lake/postgres:ci
          docker run -d --name redis --network ci redis:7.2-alpine
          for i in $(seq 1 30); do
            docker exec pg pg_isready -U poi -d poi_lake -q && exit 0
            sleep 2
          done
          docker logs pg; exit 1

      - name: migrate, seed, pytest
        run: |
          docker run --rm --network ci \
            -e APP_SECRET_KEY=ci-secret-ci-secret-ci-secret-ci-secret-xx \
            -e DATABASE_URL=postgresql+asyncpg://poi:poi@pg:5432/poi_lake \
            -e REDIS_URL=redis://redis:6379/0 \
            -e ANTHROPIC_API_KEY= \
            -v "$PWD/tests:/app/tests:ro" \
            -v "$PWD/pyproject.toml:/app/pyproject.toml:ro" \
            poi-lake/api:ci \
            sh -c "alembic upgrade head && python scripts/seed_all.py && pytest tests -q -p no:cacheprovider"

  deploy:
    name: deploy to VPS
    needs: build-test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Secrets live on this environment; add required reviewers to it in the
    # repo settings to turn auto-deploy into a one-click approval.
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: deploy ${{ github.sha }}
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The key's forced command reads the sha from SSH_ORIGINAL_COMMAND.
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o ServerAliveInterval=30 \
            "poi@$HOST" "$GITHUB_SHA"
